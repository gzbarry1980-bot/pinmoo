[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SITE_ORIGIN = "https://pinmooconsulting.com"

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/zh"
  to = "/"
  status = 301

[[redirects]]
  from = "/zh/"
  to = "/"
  status = 301

[[redirects]]
  from = "/zh/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/ai-diagnosis/*"
  to = "https://agent.pinmoo.top/:splat"
  status = 301

[[redirects]]
  from = "/guangzhou-zhongkao/*"
  to = "https://zhongkao.pinmooconsulting.com/:splat"
  status = 301

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phpMyAdmin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/pma/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/adminer.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/composer.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/composer.lock"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server-status"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/actuator/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
