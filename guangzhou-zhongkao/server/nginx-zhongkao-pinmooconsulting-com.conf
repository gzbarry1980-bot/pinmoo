server {
    listen 80;
    listen [::]:80;
    server_name zhongkao.pinmooconsulting.com;
    return 301 https://zhongkao.pinmooconsulting.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhongkao.pinmooconsulting.com;

    ssl_certificate /etc/letsencrypt/live/zhongkao.pinmooconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhongkao.pinmooconsulting.com/privkey.pem;

    root /var/www/zhongkao.pinmoo.top/current;
    index index.html;

    include /etc/nginx/snippets/pinmoo-security-headers.conf;
    include /etc/nginx/snippets/pinmoo-server-protection.conf;
    include /etc/nginx/snippets/pinmoo-performance.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 微信支付 / 退款回调：精确匹配，优先级最高，且**不做限流**。
    # 原因：微信在 15s 内收不到 HTTP 200 会按阶梯重试，回调被 429 会拖慢开通、放大对账延迟。
    # 回调自身已有 RSA 验签 + 全字段核对，不需要靠限流做防护。
    location = /api/pay/notify {
        client_max_body_size 128k;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8799;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /api/pay/refund-notify {
        client_max_body_size 128k;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8799;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 9.9 元会员付费后端（真实微信支付 v3，端口 8799）。下单/查单/会员走此段，带限流。
    location ~ ^/api/(auth|pay|membership)/ {
        client_max_body_size 32k;
        limit_req zone=pinmoo_api burst=10 nodelay;
        limit_conn pinmoo_conn 10;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8799;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 序列号兑换（客户端 redeem）仍由旧后端 8787 处理；^~ 优先于下方正则 /api/access/，互不冲突。
    # 保留现有序列号用户兑换能力（unlock.js 的 /api/access/serial/redeem）。
    location ^~ /api/access/serial/ {
        client_max_body_size 32k;
        limit_req zone=pinmoo_api burst=10 nodelay;
        limit_conn pinmoo_conn 10;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 闸门（打码 / 会员态查询）也走新后端 8799（旧 8787 的 access 接口不含 9.9 流程所需的 session 字段）
    location ~ ^/api/access/ {
        client_max_body_size 32k;
        limit_req zone=pinmoo_api burst=10 nodelay;
        limit_conn pinmoo_conn 10;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8799;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 序列号管理后台保留旧后端 8787，不冲突
    location ~ ^/api/serial-keys(?:/|$) {
        auth_basic "Pinmoo serial key manager";
        auth_basic_user_file /etc/nginx/.htpasswd-zhongkao-serial-manager;
        client_max_body_size 32k;
        limit_req zone=pinmoo_api burst=10 nodelay;
        limit_conn pinmoo_conn 10;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Serial-Manager-User $remote_user;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 管理页可访问但不得被搜索引擎收录或生成摘要。
    location ^~ /serial-key/ {
        auth_basic "Pinmoo serial key manager";
        auth_basic_user_file /etc/nginx/.htpasswd-zhongkao-serial-manager;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files $uri $uri/ =404;
        limit_except GET { deny all; }
    }

    # Revalidate HTML on every visit so interface releases appear immediately.
    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
        limit_except GET { deny all; }
    }

    # 微信业务域名校验文件（/.well-known/*.txt）必须对外可访问；^~ 优先级高于下方正则 deny，放行。
    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
    location ~* \.(?:bak|conf|ini|log|old|sql|swp|tmp)$ { deny all; }
}
