<!doctype html><html lang="zh-CN" data-app-home="/"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二批名额分配｜广州中考志愿助手</title><link rel="canonical" href="https://zhongkao.pinmooconsulting.com/quota/"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../experience.css?v=20261005b"></head><body><nav class="site-nav"></nav><main class="experience-shell" id="main"><header class="page-hero"><span class="eyebrow">第二批 · 名额分配</span><h1>先查初中，再选名额志愿。</h1><p>无需先确认资格即可查资料。填入模拟方案前，请向所在初中核实报考资格与当年分配名单。</p></header><section class="quota-card"><div class="quota-grid"><label>资料年度<select id="quotaYear"></select></label><label>查找所在初中<input id="quotaSourceSearch" type="search" placeholder="输入校名关键字"></label><label>考生所在初中<select id="quotaSource"><option value="">请选择</option></select></label></div><p class="note" id="quotaCoverage">正在加载…</p><div id="quotaResults" class="quota-results"></div></section><section class="editorial-section"><h2>安排第二批3个志愿</h2><label class="quota-confirm"><input id="quotaConfirmed" type="checkbox"><span>我已向学校确认名额分配报考资格</span></label><p class="note">查询历史记录不等于当年有该校名额。以下学校只能作为模拟参考，填报以当年官方分配计划为准。</p><div id="quotaSlots" class="quota-slots"></div><div class="toolbar"><button id="saveQuota" class="button-primary" type="button">保存第二批，继续第三四批</button><a href="/verify/?resume=1" class="button-secondary">先跳过第二批</a></div><p id="quotaSaveStatus" class="note" role="status">未确认资格时，只查看资料。</p></section><details class="workflow-disclosure"><summary>名额分配怎么看？</summary><p>必须结合考生所在初中、目标高中和年度查看，其他初中的往年分数不能直接当成自己的门槛。第二批录取后停止后续批次投档。</p><a href="https://gzzk.gz.gov.cn/zkzz/" target="_blank" rel="noreferrer">查看广州招考官方信息</a></details></main><script src="../access-gate.js?v=20261005a"></script><script src="../navigation.js?v=20261005b"></script><script type="module" src="./quota.js?v=20261005b"></script></body></html>
