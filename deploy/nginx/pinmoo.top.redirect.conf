# Legacy-domain redirect configuration. The official website is pinmooconsulting.com.
# agent.pinmoo.top must remain in its own server block.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pinmoo.top www.pinmoo.top;

    ssl_certificate /etc/letsencrypt/live/pinmoo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinmoo.top/privkey.pem;

    # Search Console's Change of Address check expects the legacy homepage
    # to redirect directly to the selected new-site homepage.
    location = / {
        return 301 https://pinmooconsulting.com/;
    }

    location = /ai-diagnosis {
        return 301 https://agent.pinmoo.top/;
    }

    location ^~ /ai-diagnosis/ {
        return 301 https://agent.pinmoo.top/;
    }

    location ~ ^/(?:robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|ai\.txt|ai-context\.json|pinmoo-profile\.json|favicon\.svg)$ {
        return 301 https://pinmooconsulting.com$request_uri;
    }

    location ^~ /assets/ {
        return 301 https://pinmooconsulting.com$request_uri;
    }

    location ^~ /src/ {
        return 301 https://pinmooconsulting.com$request_uri;
    }

    location = /china-ecommerce-consulting {
        return 301 https://pinmooconsulting.com/china-ecommerce-consulting/;
    }

    location = /china-ecommerce-consulting/ {
        return 301 https://pinmooconsulting.com/china-ecommerce-consulting/;
    }

    location ~ ^/en(?:/(.*))?$ {
        return 301 https://pinmooconsulting.com/$1$is_args$args;
    }

    location ~ ^/zh(?:/(.*))?$ {
        return 301 https://pinmooconsulting.com/zh/$1$is_args$args;
    }

    location / {
        return 301 https://pinmooconsulting.com/zh$request_uri;
    }
}
