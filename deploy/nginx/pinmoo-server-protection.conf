# Include this file inside the HTTPS server block for pinmoo.top.
server_tokens off;
charset utf-8;
client_max_body_size 64k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
keepalive_timeout 20s;
keepalive_requests 100;
reset_timedout_connection on;

# Allow a normal page load to arrive in a short burst, then hold sustained
# traffic from one address to 10 requests per second and 30 live connections.
limit_req zone=pinmoo_per_ip burst=60 nodelay;
limit_conn pinmoo_conn_per_ip 30;

open_file_cache max=1000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;
