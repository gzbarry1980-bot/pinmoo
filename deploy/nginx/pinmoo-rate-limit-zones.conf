# Load this file from the nginx http context, for example via conf.d/*.conf.
# The burst allowance lets browsers fetch a full page without being throttled,
# while sustained request floods from one address are limited.
limit_req_zone $binary_remote_addr zone=pinmoo_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=pinmoo_conn_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
